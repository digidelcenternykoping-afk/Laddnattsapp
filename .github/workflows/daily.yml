name: Daglig prognos

on:
  schedule:
    # Morgondagens priser publiceras ca 13:00 svensk tid. Två körningar så att
    # prognosen kommer i tid både sommar- och vintertid och om priserna är sena.
    - cron: "40 11 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast/requirements.txt
      - run: pip install -r forecast/requirements.txt
      - name: Hämta data och räkna prognos
        env:
          PYTHONPATH: forecast
        run: python -m laddnatt.daily --data data --out public/forecast_SE3.json
      - name: Spara prognos och data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git diff --cached --quiet || git commit -m "Prognos $(date -u +%F)"
          git push
