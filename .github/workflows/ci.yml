name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast/requirements.txt
      - run: pip install -r forecast/requirements.txt
      - name: Enhetstester
        working-directory: forecast
        run: python -m pytest -q
      - name: Återanvänd nedladdad historik
        uses: actions/cache@v4
        with:
          path: data
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: Test mot historik
        env:
          PYTHONPATH: forecast
        run: |
          python -m laddnatt.backtest --data data --out backtest.md
          cat backtest.md >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Tester och bygge
        working-directory: android
        run: gradle :core:test :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: laddnatt-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
